- name: Nginx install with OS distribution
  hosts: local
  become: yes 
  connection: local
  tasks: 
   - name: Nginx
     ansible.builtin.dnf:
      name: nginx
      state: installed
     when: ansible_os_family=="Redhat"
   - name:  Nginx install
     ansible.builtin.apt:
      name: nginx
      state: installed
     when: ansible_os_family=="Debian"
