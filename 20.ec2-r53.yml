- name: create ec2 and r53 records
  hosts: local
  connection: local
  vars:
   subnet_id: subnet-09d1fc3d8d50f747b
   sg_id: sg-033d1dbab6efbdc59
   ami_id: ami-0220d79f3f480ecf5
   instances: 
    - mysql
    - frontend
    - backend
  zone: mamathakishore.shop
  tasks:
   - name: install boto3 and botocore
     ansible.builtin.pip:
      name:
       - boto3
       - botocore
      executable: pip3.9
   - name: install ec2
     amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: "t3.micro"
      sg_id: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
     loop: "{{ instances }}"
     register: ec2_instances

   - name: print o/p
     ansible.builtin.debug:
     msg: " {{ ec2_instances }}"

   # create r53 records 
   - name: create r53 records
     ansible.aws.route53:
      zone: {{ zone }}
      type: A
      wait: true
      ttl: 1
      overwrite: yes
      record: " {{ item.item}}.{{ zone }} "
      value: " {{ item.instances[0].private_ip_address }}"
     loop : "{{ ec2_instances.results }}"

     # for the frontend r53 records 
   - name: create r53 records
     ansible.aws.route53:
      zone: {{ zone }}
      type: A
      wait: true
      ttl: 1
      overwrite: yes
      record: " {{ zone }} "
      when:
        item.item== "frontend"
      value: " {{ item.instances[0].public_ip_address }}"
     loop : "{{ ec2_instances.results }}"